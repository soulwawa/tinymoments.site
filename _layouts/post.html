---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %-m월 %-d일" }}</time>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <nav class="post-nav">
    {% if page.categories contains 'release' %}
      <a href="{{ '/release/' | relative_url }}">← 릴리즈 노트 목록</a>
    {% else %}
      <a href="{{ '/blog/' | relative_url }}">← 블로그 목록</a>
    {% endif %}
  </nav>
</article>
