<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작은 위로 - Tiny Moments</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
            background: linear-gradient(135deg, #FAF8F2, #F5E6D0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3D3028;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        p { font-size: 1.1rem; color: #8B7355; }
    </style>
</head>
<body>
    <div class="container">
        <h1>작은 위로</h1>
        <p>아이의 사진과 함께 하루의 위로를 전합니다.</p>
    </div>
</body>
</html>
