<footer class="site-footer">
  <div class="site-footer-inner">
    <a href="{{ '/support/' | relative_url }}">고객 지원</a>
    <a href="{{ '/privacy/' | relative_url }}">개인정보 처리방침</a>
    {% if site.analytics.measurement_id %}
    <button type="button" id="analytics-settings" class="analytics-settings" aria-controls="analytics-consent" aria-expanded="false" hidden>웹 분석 설정</button>
    {% endif %}
    <span>© 2026 작은 위로</span>
  </div>
</footer>
{% if site.analytics.measurement_id %}
<section id="analytics-consent" class="analytics-consent" aria-labelledby="analytics-consent-title" hidden>
  <div class="analytics-copy">
    <h2 id="analytics-consent-title">사이트 개선을 위해 방문·설치 링크 클릭을 분석할까요?</h2>
    <p class="analytics-meta"><span>Google Analytics 사용</span><a href="{{ '/privacy/#web-analytics' | relative_url }}">자세히 보기</a></p>
  </div>
  <div class="analytics-actions">
    <button type="button" data-analytics-consent="denied">거부</button>
    <button type="button" data-analytics-consent="granted">허용</button>
  </div>
</section>
{% endif %}
